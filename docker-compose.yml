services:
  db:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--replSet", "mnc-rs", "--bind_ip_all", "--port", "27018"]
    ports:
      - "127.0.0.1:27018:27018"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --port 27018 --quiet --eval
          'try { quit(rs.status().ok === 1 ? 0 : 1); }
          catch (e) { rs.initiate({_id:"mnc-rs",members:[{_id:0,host:"127.0.0.1:27018"}]}); quit(1); }'
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mongodata:
